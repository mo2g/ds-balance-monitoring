name: DSBalanceMonitor
options:
  bundleIdPrefix: com.mo
  createIntermediateGroups: true
  postGenCommand: sed -i '' 's/objectVersion = 77;/objectVersion = 60;/' DSBalanceMonitor.xcodeproj/project.pbxproj
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0
targets:
  DSBalanceMonitor:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      - path: Core
      - path: Models
      - path: Support
        buildPhase: resources
        excludes:
          - Info.plist
          - AppIcon-source.png
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: DSBalanceMonitor
        CFBundleDisplayName: DS Balance Monitor
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        CFBundleIconFile: AppIcon
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mo.DSBalanceMonitor
        PRODUCT_NAME: DSBalanceMonitor
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: false
        GENERATE_INFOPLIST_FILE: false
  DSBalanceMonitorTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: DSBalanceMonitor
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mo.DSBalanceMonitorTests
        GENERATE_INFOPLIST_FILE: true
schemes:
  DSBalanceMonitor:
    build:
      targets:
        DSBalanceMonitor: all
        DSBalanceMonitorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - DSBalanceMonitorTests
